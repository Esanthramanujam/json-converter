# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Setup: the configure-pages step below turns Pages on automatically. If your
# account or organisation blocks that, set it by hand once under repository
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# By default the site is published to
#   https://<owner>.github.io/<repo>/
# To use a custom domain instead, set repository variables (Settings ->
# Secrets and variables -> Actions -> Variables):
#   SITE_URL       https://your-domain.com
#   BASE_PATH      /
#   TRAILING_SLASH 1     (GitHub Pages serves folder indexes with a slash)
# and add the domain under Settings -> Pages -> Custom domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, so a misconfigured Pages setting fails in seconds rather than
      # after a full build. enablement:true turns Pages on with the GitHub
      # Actions source if it has never been enabled for this repository.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          TRAILING_SLASH: ${{ vars.TRAILING_SLASH || '1' }}
        run: npm run build

      - name: Audit the prerendered output
        run: npm run verify:seo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
